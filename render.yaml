services:
  - type: web
    name: tripmate-ai
    runtime: python
    plan: free
    buildCommand: uv sync --frozen --no-dev
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: UV_VERSION
        value: 0.13.7
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AVIATIONSTACK_API_KEY
        sync: false
