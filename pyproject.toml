[project]
name = "tripmate-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aarush Rawat", email = "rawataarush2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "airportsdata>=20260905",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openrouter>=0.2.8",
    "langchain-postgres>=0.0.18",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.5",
    "pycountry>=26.2.16",
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tavily>=1.1.0",
    "tenacity>=9.1.4",
]

[project.scripts]
tripmate-ai = "tripmate_ai:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
