[project]
name = "tripmate-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aarush Rawat", email = "rawataarush2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "airportsdata>=20261103",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "langchain-openrouter>=0.2.9",
    "langchain-postgres>=0.0.19",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.8",
    "pycountry>=26.2.16",
    "pydantic>=2.12.5",
    "python-dateutil>=4.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tavily>=1.1.0",
    "tenacity>=9.2.1",
]

[project.scripts]
tripmate-ai = "tripmate_ai:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
